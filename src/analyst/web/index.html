<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Security Analyst</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <main class="container">

        <h1>AI Security Analyst</h1>

        <p class="subtitle">
            Initial security assessment for internal AI use cases
        </p>

        <section class="card">

            <h2>AI Use Case</h2>

            <p>
                Paste the use case information as JSON.
            </p>

            <textarea
                id="useCase"
                spellcheck="false"
            >{
  "name": "Customer Support AI Assistant",
  "business_owner": "Customer Support Director",
  "purpose": "Summarize customer conversations and suggest responses to support agents.",
  "data_processed": [
    "customer names",
    "account information",
    "support tickets",
    "conversation history"
  ],
  "data_sensitivity": "Customer and account information may be sensitive.",
  "ai_provider": "Third-party hosted LLM API",
  "security_controls": "Not specified",
  "human_oversight": "A human support agent reviews the generated response before sending it to the customer.",
  "logging_monitoring": "Not specified",
  "access_controls": "Not specified",
  "third_party_security_assessment": "Not specified",
  "intended_use": "Summarize support conversations and suggest draft responses.",
  "limitations": "Not specified",
  "risk_level": "Not specified",
  "additional_review": "Not specified"
}</textarea>

            <button id="assessButton">
                Assess Use Case
            </button>

            <p id="error" class="error"></p>

        </section>


        <section
            id="results"
            class="card hidden"
        >

            <div class="result-header">

                <div>
                    <h2>Assessment</h2>
                    <p id="overallStatus"></p>
                </div>

            </div>


            <div id="requirements"></div>


            <h2>Risks</h2>

            <ul id="risks"></ul>


            <h2>Recommended Actions</h2>

            <ul id="actions"></ul>

        </section>

    </main>

    <script src="/static/app.js"></script>

</body>
</html>
