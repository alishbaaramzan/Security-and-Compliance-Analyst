<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Security Analyst</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <main class="container">

        <h1>AI Security Analyst</h1>

        <p class="subtitle">
            Initial security assessment for internal AI use cases
        </p>

        <section class="card">

            <h2>AI Use Case</h2>

            <p>
                Paste the use case information.
            </p>

            <textarea
                id="useCase"
                spellcheck="false"
            ></textarea>

            <button id="assessButton">
                Assess Use Case
            </button>

            <p id="error" class="error"></p>

        </section>


        <section
            id="results"
            class="card hidden"
        >

            <div class="result-header">

                <div>
                    <h2>Assessment</h2>
                    <p id="overallStatus"></p>
                </div>

            </div>


            <div id="requirements"></div>


            <h2>Risks</h2>

            <ul id="risks"></ul>


            <h2>Recommended Actions</h2>

            <ul id="actions"></ul>

        </section>

    </main>

    <script src="/static/app.js"></script>

</body>
</html>
